name: Finalize Global Scheduler

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message != 'chore(core): finalize global scheduler seal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML
      - name: Run scheduler tests
        run: python -m pytest -q tests/smoke/test_event_bus_scheduler_isolation.py
      - name: Reseal and verify core
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify
      - name: Commit seal and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/CORE.lock
          git rm .github/workflows/_finalize_scheduler.yml
          git commit -m "chore(core): finalize global scheduler seal"
          git push
