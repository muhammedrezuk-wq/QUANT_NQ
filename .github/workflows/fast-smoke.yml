name: QUANT_NQ Fast Smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run fast smoke suite
        run: python scripts/run_smoke.py

      - name: Reseal scheduler core
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git log -1 --pretty=%s)"
          if [[ "$latest" == "chore(core): reseal scheduler core" ]]; then
            exit 0
          fi
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/CORE.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(core): reseal scheduler core"
          git push origin HEAD:fix/global-scheduler-final
