name: QUANT_NQ Fast Smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run scheduler isolation tests
        run: python -m pytest -q tests/smoke/test_event_bus_scheduler_isolation.py

      - name: Run fast smoke suite
        run: python scripts/run_smoke.py

      - name: Reseal core and verify
        if: ${{ github.event_name == 'push' && github.event.head_commit.message != 'chore(core): finalize scheduler' }}
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify

      - name: Commit finalized seal
        if: ${{ github.event_name == 'push' && github.event.head_commit.message != 'chore(core): finalize scheduler' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/CORE.lock
          git rm -f .github/workflows/_finalize_scheduler.yml
          git commit -m "chore(core): finalize scheduler"
          git push
