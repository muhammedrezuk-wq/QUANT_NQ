name: QUANT_NQ Fast Smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run fast smoke suite
        run: python scripts/run_smoke.py

      - name: Print exact core seal
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path('core')
          suffixes = {'.py','.html','.css','.js','.json','.yaml','.yml'}
          files = {}
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name != 'CORE.lock' and p.suffix.lower() in suffixes:
                  data = p.read_bytes().replace(b'\r\n', b'\n')
                  files[str(p.relative_to(Path('.'))).replace('\\','/')] = hashlib.sha256(data).hexdigest()
          entries = sorted(files.items())
          joined = '\n'.join(f'{name}:{digest}' for name,digest in entries)
          root_digest = hashlib.sha256(joined.encode()).hexdigest()
          version_text = Path('core/__version__.py').read_text(encoding='utf-8')
          version = re.search(r'CORE_VERSION\s*=\s*[\"\']([^\"\']+)[\"\']', version_text).group(1)
          print('CORE_VERSION=' + version)
          print('FILE_COUNT=' + str(len(entries)))
          print('ROOT_DIGEST=' + root_digest)
          print('FILES_JSON=' + json.dumps(dict(entries), ensure_ascii=False, sort_keys=True))
          PY
