name: QUANT_NQ Fast Smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run scheduler isolation tests
        run: python -m pytest -q tests/smoke/test_event_bus_scheduler_isolation.py

      - name: Run fast smoke suite
        run: python scripts/run_smoke.py

      - name: Prepare core seal artifact
        if: ${{ github.event_name == 'push' }}
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify

      - name: Upload core seal artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-seal
          path: core/CORE.lock
          if-no-files-found: error
          retention-days: 1
