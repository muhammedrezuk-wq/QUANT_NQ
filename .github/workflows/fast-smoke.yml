name: QUANT_NQ Fast Smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run fast smoke suite
        run: python scripts/run_smoke.py

      - name: Reseal modified core
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger core reseal' }}
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/CORE.lock
          git commit -m "chore(core): reseal after scheduler isolation" || exit 0
          git push
