name: one-shot-core-reseal

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  reseal:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/global-scheduler' && github.event.pull_request.head.sha != github.event.pull_request.base.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-scheduler
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reseal core once
        if: ${{ !contains(github.event.pull_request.head.ref, 'sealed') && github.event.pull_request.head.sha != github.event.pull_request.base.sha }}
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/CORE.lock
          git commit -m "chore(core): reseal after scheduler isolation" || exit 0
          git push origin HEAD:fix/global-scheduler
