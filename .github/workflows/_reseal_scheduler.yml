name: one-time-core-reseal

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  reseal:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/global-scheduler-final' && github.event.pull_request.head.sha != github.event.pull_request.base.sha && github.event.pull_request.head_commit.message != 'chore(core): reseal scheduler core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-scheduler-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reseal
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify
          python -m pytest -q tests/smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/CORE.lock
          git commit -m "chore(core): reseal scheduler core"
          git push origin HEAD:fix/global-scheduler-final
