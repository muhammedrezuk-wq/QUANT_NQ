name: apply-global-scheduler

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'chore(core): global scheduler isolation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply scheduler architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          marker = "# QUANT_NQ_GLOBAL_SCHEDULER_V1"
          path = Path("core/event_bus.py")
          text = path.read_text(encoding="utf-8")
          if marker not in text:
              text += r'''

# QUANT_NQ_GLOBAL_SCHEDULER_V1
# Global execution isolation: the EventBus remains an ordering/routing plane;
# handler execution runs outside the Core asyncio coordination loop. Publications
# originating in worker loops are marshalled back onto the Core loop so all EventBus
# state mutation remains single-loop and deterministic.
import contextvars as _scheduler_contextvars
import os as _scheduler_os
from concurrent.futures import ThreadPoolExecutor as _SchedulerThreadPoolExecutor

_SCHEDULER_TIME_EVENTS = frozenset({
    "SYS_SECOND", "SYS_5MIN", "SYS_15MIN", "SYS_HOUR", "SYS_DAY",
})

_original_eventbus_init = EventBus.__init__
_original_eventbus_publish = EventBus.publish
_original_eventbus_subscribe = EventBus.subscribe
_original_eventbus_subscribe_all = EventBus.subscribe_all
_original_eventbus_run_handler = EventBus._run_handler
_original_is_replayable = _is_replayable


def _scheduler_init(self, *args, **kwargs):
    _original_eventbus_init(self, *args, **kwargs)
    workers = min(32, max(4, (_scheduler_os.cpu_count() or 1) + 4))
    self._scheduler_pool = _SchedulerThreadPoolExecutor(
        max_workers=workers,
        thread_name_prefix="quant-event-handler",
    )
    self._scheduler_core_loop = None


def _scheduler_bind_core_loop(self):
    try:
        loop = asyncio.get_running_loop()
    except RuntimeError:
        return None
    current = getattr(self, "_scheduler_core_loop", None)
    if current is None or current.is_closed():
        self._scheduler_core_loop = loop
    return self._scheduler_core_loop


def _scheduler_subscribe(self, *args, **kwargs):
    _scheduler_bind_core_loop(self)
    return _original_eventbus_subscribe(self, *args, **kwargs)


def _scheduler_subscribe_all(self, *args, **kwargs):
    _scheduler_bind_core_loop(self)
    return _original_eventbus_subscribe_all(self, *args, **kwargs)


def _scheduler_handler_entry(handler, args):
    result = handler(*args)
    if _scheduler_inspect.isawaitable(result):
        return asyncio.run(result)
    return result


async def _scheduler_run_handler(self, handler, is_coro, *args):
    # Every event handler executes outside the Core coordination loop.
    # contextvars are copied so trace/event context remains intact in the worker.
    loop = asyncio.get_running_loop()
    context = _scheduler_contextvars.copy_context()
    future = loop.run_in_executor(
        self._scheduler_pool,
        lambda: context.run(_scheduler_handler_entry, handler, args),
    )
    async with asyncio.timeout(self._dispatch_timeout_s):
        await future


async def _scheduler_publish(self, event_name, payload=None, *, publisher=""):
    core_loop = getattr(self, "_scheduler_core_loop", None)
    try:
        caller_loop = asyncio.get_running_loop()
    except RuntimeError:
        caller_loop = None
    if core_loop is None or core_loop.is_closed():
        if caller_loop is None:
            raise RuntimeError("EventBus.publish requires a running event loop")
        self._scheduler_core_loop = caller_loop
        return await _original_eventbus_publish(
            self, event_name, payload, publisher=publisher
        )
    if caller_loop is core_loop:
        return await _original_eventbus_publish(
            self, event_name, payload, publisher=publisher
        )
    future = asyncio.run_coroutine_threadsafe(
        _original_eventbus_publish(self, event_name, payload, publisher=publisher),
        core_loop,
    )
    return await asyncio.wrap_future(future)


def _scheduler_is_replayable(event_name):
    # Clock ticks are triggers/state notifications, not historical data.
    return event_name in _SCHEDULER_TIME_EVENTS or _original_is_replayable(event_name)


import inspect as _scheduler_inspect
EventBus.__init__ = _scheduler_init
EventBus.subscribe = _scheduler_subscribe
EventBus.subscribe_all = _scheduler_subscribe_all
EventBus._run_handler = _scheduler_run_handler
EventBus.publish = _scheduler_publish
_is_replayable = _scheduler_is_replayable
'''
              path.write_text(text, encoding="utf-8")

          version_path = Path("core/__version__.py")
          version = version_path.read_text(encoding="utf-8")
          new_version, count = re.subn(
              r'CORE_VERSION\s*=\s*["\'][0-9]+\.[0-9]+\.[0-9]+["\']',
              'CORE_VERSION = "1.28.0"',
              version,
              count=1,
          )
          if count != 1:
              raise SystemExit("CORE_VERSION constant not found")
          version_path.write_text(new_version, encoding="utf-8")
          PY

      - name: Run focused scheduler proof
        run: |
          python - <<'PY'
          import asyncio
          import time
          from core.event_bus import EventBus

          async def main():
              bus = EventBus(dispatch_timeout_s=2.0, mailbox_max_events=64)
              fast_done = asyncio.Event()
              seen = []

              async def slow(_payload):
                  time.sleep(0.20)

              async def fast(_payload):
                  seen.append("fast")
                  fast_done.set()

              bus.subscribe("TEST.EVENT", slow, subscriber="slow")
              bus.subscribe("TEST.EVENT", fast, subscriber="fast")
              started = time.perf_counter()
              await bus.publish("TEST.EVENT", {"x": 1})
              await asyncio.wait_for(fast_done.wait(), timeout=0.50)
              elapsed = time.perf_counter() - started
              assert elapsed < 0.45, elapsed
              assert seen == ["fast"], seen

              child_seen = asyncio.Event()
              async def child(_payload):
                  child_seen.set()
              bus.subscribe("CHILD", child, subscriber="child")

              async def parent(_payload):
                  await bus.publish("CHILD", {"ok": True}, publisher="parent")

              bus.subscribe("PARENT", parent, subscriber="parent")
              await bus.publish("PARENT", {"ok": True})
              await asyncio.wait_for(child_seen.wait(), timeout=0.50)

              for i in range(20):
                  await bus.publish("SYS_SECOND", {"count": i})
              stats = bus.stats()
              assert stats["coalesced"].get("SYS_SECOND", 0) > 0, stats

          asyncio.run(main())
          PY

      - name: Verify sealed core and smoke suite
        run: |
          python governance/scripts/freeze_core.py freeze --reseal
          python governance/scripts/freeze_core.py verify
          python scripts/run_smoke.py

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/event_bus.py core/__version__.py core/CORE.lock .github/workflows/_apply_global_scheduler.yml
          git rm .github/workflows/_apply_global_scheduler.yml
          git commit -m "chore(core): global scheduler isolation"
          git push
