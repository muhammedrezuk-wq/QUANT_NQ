# تشغيل الكريبتو فقط — ناقل وبيانات مستقلان عن atoms/ الخاصة بالفوركس.
log_level: INFO
log_json: true
atoms_root: atoms_crypto
snapshot_root: var/crypto/snapshots

event_bus:
  payload_mode: shared_readonly
  worker_count: 4
  partitioned_ownership: true
  mailbox_max_events: 1024

journal:
  path: var/crypto/journal.jsonl

discovery:
  rescan_interval_s: 5.0

api:
  enable_api: true
  host: 127.0.0.1
  port: 8020

secrets:
  enabled: true
  allow_prompt: false
  dpapi_blob: runtime/crypto.key
