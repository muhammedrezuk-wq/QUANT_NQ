# تشغيل الكريبتو فقط — ناقل وبيانات مستقلان عن atoms/ الخاصة بالفوركس.
log_level: INFO
log_json: true
atoms_root: atoms_crypto
snapshot_root: var/snapshots

event_bus:
  payload_mode: shared_readonly
  worker_count: 4
  partitioned_ownership: true
  mailbox_max_events: 1024

journal:
  path: var/journal.jsonl

discovery:
  rescan_interval_s: 5.0

api:
  enable_api: true
  host: 0.0.0.0
  port: 8020
  # External binding requires an API key from QUANT_GOV_API_KEY or
  # QUANT_CORE_API_KEY; secrets are never committed to this file.

secrets:
  enabled: true
  allow_prompt: false
  # ٢٠٢٦-٠٩-٠٤ (ختم NQ · قرار المالك «أ»: الكريبتو يشارك خزنة الفوركس):
  # كان المسار `runtime/crypto.key` — خطآن معًا. الاسم أوّلًا: الملفّ الموجود
  # على القرص هو `runtime/device.key`، و`crypto.key` لا وجود له إطلاقًا.
  # والمسار ثانيًا: `run_crypto.py` يعمل chdir إلى `crypto_runtime/`، فقيمةٌ
  # بلا `../` تُحلّ إلى `crypto_runtime/runtime/…` — داخل الـruntime لا بجانبه.
  # فبقيت خزنة الكريبتو LOCKED دائمًا (و`allow_prompt: false` يقطع الاسترجاع).
  # قارن `core_forex.yaml`: كُتب بـ`../` لأنّه يفترض الـchdir نفسه — وهذا الملفّ
  # لم يُكتب كذلك. مقيس ٢٠٢٦-٠٩-٠٤.
  vault_path: ../runtime/secrets.enc
  dpapi_blob: ../runtime/device.key
