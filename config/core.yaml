# إعداد Core العام فقط — لا يحتوي أي إعداد خاص بذرة بعينها (المادة 8/95).
log_level: INFO
log_json: true
atoms_root: atoms

event_bus:
  payload_mode: shared_readonly
  worker_count: 4
  partitioned_ownership: true
  mailbox_max_events: 1024

journal:
  path: var/journal.jsonl

discovery:
  rescan_interval_s: 5.0

api:
  enable_api: true
  host: 0.0.0.0
  port: 8010
  # External binding requires an API key. Set QUANT_GOV_API_KEY or
  # QUANT_CORE_API_KEY in the runtime environment; do not commit secrets.

secrets:
  enabled: true
  allow_prompt: false
  dpapi_blob: runtime/device.key
